version: '3.8'

services:
  credit_risk_platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit_risk_platform_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - RUNNING_IN_DOCKER=true
      - PORT=8501
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./documents:/app/documents
    restart: unless-stopped
